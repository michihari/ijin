<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>偉人録 — 時代順の記録</title>
<meta name="theme-color" content="#1B1A18">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="偉人録">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEECE4;
    --paper-deep:#E3E0D5;
    --ink:#1B1A18;
    --ink-soft:#4F4C46;
    --ai:#2B4570;
    --nezu:#8E9089;
    --rule:#C9C6BB;
    --font:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.9}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  :focus-visible{outline:2px solid var(--ai);outline-offset:3px}
  .wrap{max-width:1060px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
  @media (max-width:560px){.wrap{padding-top:calc(24px + env(safe-area-inset-top))}}

  /* ログイン画面 */
  .login{min-height:calc(100vh - 220px);display:grid;place-items:center;padding:40px 0}
  .login .card{width:min(400px,100%);display:grid;gap:22px}
  .login h2{margin:0;font-size:30px;font-weight:500;letter-spacing:.3em;line-height:1.2}
  .login h2 small{display:block;font-size:13px;color:var(--nezu);letter-spacing:.15em;margin-bottom:10px}
  .login .field input{font-size:17px;padding:10px 2px}
  .login .btn.primary{width:100%;padding:12px;font-size:16px;letter-spacing:.2em}
  .login .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header.site{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:14px}
  header.site h1{margin:0;font-size:22px;font-weight:500;letter-spacing:.2em}
  header.site h1 button{letter-spacing:inherit;font-size:inherit;font-weight:inherit}
  .brand{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
  .nav{display:flex;gap:4px}
  .nav button{font-size:14px;letter-spacing:.18em;padding:2px 10px;color:var(--ink-soft);border-bottom:1px solid transparent}
  .nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .who-now{font-size:13px;letter-spacing:.06em;color:var(--nezu);display:flex;align-items:center;gap:7px}
  .who-now .mark{border:1px solid var(--ai);color:var(--ai);border-radius:2px;font-size:11px;letter-spacing:.16em;padding:0 7px}
  .btn{border:1px solid var(--ink);padding:6px 16px;border-radius:2px;font-size:14px;letter-spacing:.08em;background:var(--paper)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.quiet{border-color:var(--rule);color:var(--ink-soft)}
  .btn.danger{border:none;color:#8A2E2E;text-decoration:underline;text-underline-offset:4px;padding:6px 4px}
  .hidden{display:none!important}
  .link{color:var(--ai);text-decoration:underline;text-underline-offset:4px;font-size:13px;letter-spacing:.06em}

  .notice{margin-top:28px;border:1px solid var(--ink);padding:20px 22px;background:var(--paper-deep);font-size:14px;line-height:1.9}
  .notice code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#fff;padding:1px 5px}

  .gate{margin-top:44px}
  /* ミックス：泡 */
  .mix-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:36px 0 12px}
  .mix-head p{margin:0;color:var(--ink-soft);font-size:14px}
  .pond{position:relative;height:calc(100vh - 220px);min-height:520px;overflow:hidden;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .bubble{position:absolute;left:var(--x);top:110%;width:var(--s);height:var(--s);border-radius:50%;
    border:1px solid var(--ink);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.45) 45%,rgba(238,236,228,.2) 100%);
    box-shadow:inset -6px -10px 18px rgba(43,69,112,.10);display:flex;align-items:center;justify-content:center;text-align:center;padding:0;
    animation:rise var(--dur) cubic-bezier(.2,.7,.2,1) var(--delay) forwards, bob 5.5s ease-in-out calc(var(--delay) + var(--dur)) infinite alternate;
    transition:transform .2s}
  .bubble:hover{transform:scale(1.05)}
  .bubble .nm{writing-mode:vertical-rl;font-size:var(--f);font-weight:500;letter-spacing:.18em;line-height:1.15;max-height:78%;overflow:hidden}
  .bubble .yr{position:absolute;bottom:14%;left:0;right:0;font-size:11px;color:var(--ai);letter-spacing:.06em;line-height:1}
  .bubble .ct{position:absolute;top:14%;left:0;right:0;font-size:10px;color:var(--nezu);letter-spacing:.2em;line-height:1}
  @keyframes rise{to{top:var(--y)}}
  @keyframes bob{from{margin-top:0}to{margin-top:-10px}}
  @media (prefers-reduced-motion:reduce){.bubble{animation:none;top:var(--y)}}
  .peek .meta{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;color:var(--ai)}
  .peek .meta .y{font-size:26px;font-weight:500}
  .peek h3{font-size:26px;letter-spacing:.16em}
  .peek .desc{margin:0;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto}
  .gate ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
  .gate li{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .gate li button{width:100%;height:100%;min-height:150px;padding:20px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;transition:background .18s}
  .gate li button:hover{background:var(--paper-deep)}
  .gate .cat-name{writing-mode:vertical-rl;white-space:nowrap;font-size:26px;font-weight:500;letter-spacing:.3em;line-height:1;height:112px}
  .gate .cat-name.long{font-size:21px;letter-spacing:.1em}
  .gate .count{font-size:13px;color:var(--nezu);align-self:flex-end}
  @media (max-width:760px){.gate ul{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:480px){.gate ul{grid-template-columns:repeat(2,1fr)}.gate li button{min-height:130px}}

  .cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:36px 0 18px}
  .cat-head h2{margin:0;font-size:38px;font-weight:500;letter-spacing:.25em;line-height:1.2}
  .cat-head h2 small{display:block;font-size:13px;color:var(--nezu);letter-spacing:.15em;margin-bottom:8px}
  .seg{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
  .seg button{padding:5px 14px;font-size:13px;letter-spacing:.06em;color:var(--ink-soft)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .options{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .options .lbl{font-size:13px;color:var(--nezu);letter-spacing:.1em}
  .filters{display:flex;flex-wrap:wrap;gap:7px;padding:14px 0;border-bottom:1px solid var(--rule)}
  .chip{border:1px solid var(--rule);border-radius:2px;padding:3px 11px;font-size:13px;letter-spacing:.08em;color:var(--nezu)}
  .chip[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:#fff}
  .chip.all{border-style:dashed}

  .list{margin:0;padding:0;list-style:none}
  .entry{padding:26px 0;border-bottom:1px solid var(--rule);position:relative}
  .entry .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .entry .who{margin:0;font-size:22px;font-weight:500;letter-spacing:.14em}
  .entry .life{font-size:14px;color:var(--ink-soft);letter-spacing:.04em}
  .list.tate .life{display:inline-block;margin-left:14px}
  .entry .tag{font-size:12px;letter-spacing:.14em;color:var(--ai);border:1px solid var(--ai);border-radius:2px;padding:1px 8px;line-height:1.7}
  .entry .desc{margin:0;white-space:pre-wrap;word-break:break-word;max-width:44em}
  .entry .more{font-size:13px;color:var(--ai);text-decoration:underline;text-underline-offset:4px;margin-top:6px}
  .entry .head{position:relative}
  .entry .ops{margin-left:auto;padding-left:16px}
  .entry .ops button{font-size:12px;color:var(--nezu);letter-spacing:.1em;text-decoration:underline;text-underline-offset:4px}
  .list.tate .ops{margin:0;padding:0}

  .list.tate{writing-mode:vertical-rl;height:calc(100vh - 320px);min-height:440px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0 8px;scrollbar-gutter:stable}
  .list.tate .entry{display:block;height:100%;padding:8px 28px;border-bottom:none;border-left:1px solid var(--rule)}
  .list.tate .entry:last-child{border-left:none}
  .list.tate .num{text-combine-upright:all}
  .list.tate .head{display:block;margin:0 0 0 8px}
  .list.tate .who{display:inline-block}
  .list.tate .tag{display:inline-block;margin-top:10px;padding:8px 1px}
  .list.tate .desc{max-width:none;max-height:100%;text-align:justify;margin-left:6px}
  .list.tate .more{display:block;margin-left:10px}
  .list.tate .ops{display:block;margin-left:16px}

  .empty{padding:60px 0;color:var(--nezu);text-align:center;letter-spacing:.1em}
  .empty button{color:var(--ai);text-decoration:underline;text-underline-offset:4px}

  dialog{border:none;border-radius:2px;background:var(--paper);color:var(--ink);padding:0;width:min(720px,94vw);max-height:92vh;box-shadow:0 30px 60px rgba(27,26,24,.25)}
  dialog.narrow{width:min(420px,94vw)}
  dialog::backdrop{background:rgba(27,26,24,.45)}
  dialog .body{padding:32px;display:grid;gap:18px}
  dialog h3{margin:0;font-size:20px;font-weight:500;letter-spacing:.2em}
  dialog p.note{margin:0;color:var(--ink-soft);font-size:14px}
  .field{display:grid;gap:6px}
  .field label{font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
  .field input,.field textarea,.field select{width:100%;border:none;border-bottom:1px solid var(--ink);background:transparent;padding:8px 2px;border-radius:0}
  .field textarea{border:1px solid var(--ink);padding:12px;min-height:250px;line-height:1.9;resize:vertical}
  .field .hint{font-size:12px;color:var(--nezu)}
  .date-row{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto;gap:8px;align-items:end}
  .date-row .unit{padding-bottom:9px;color:var(--ink-soft)}
  .date-row label.bc{display:flex;gap:6px;align-items:center;padding-bottom:8px;white-space:nowrap;color:var(--ink-soft);font-size:14px}
  .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
  .actions .r{display:flex;gap:10px;align-items:center}
  .err{color:#8A2E2E;font-size:13px}
  .ok{color:var(--ai);font-size:13px;border-left:2px solid var(--ai);padding-left:10px;line-height:1.8}
  @media (max-width:520px){.date-row{grid-template-columns:1fr auto 1fr auto 1fr auto}.date-row label.bc{grid-column:1/-1}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:2px;font-size:13px;letter-spacing:.1em;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="brand">
      <h1><button id="home">偉人録</button></h1>
      <span style="font-size:11px;color:var(--nezu);letter-spacing:.1em" id="build"></span>
      <nav class="nav" aria-label="表示">
        <button id="navAll">通覧</button>
        <button id="navMix">ミックス</button>
      </nav>
    </div>
    <div class="toolbar">
      <span class="who-now" id="whoNow"></span>
      <button class="btn quiet" id="loginBtn">ログイン</button>
      <button class="btn quiet hidden" id="logoutBtn">ログアウト</button>
      <button class="btn quiet" id="diagBtn">診断</button>
      <button class="btn quiet" id="export">書き出し</button>
      <button class="btn quiet hidden" id="import">読み込み</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
  </header>

  <div class="notice hidden" id="setupNotice"></div>

  <section class="gate" id="gate">
    <ul id="gateList"></ul>
  </section>

  <section id="loginView" class="hidden login">
    <form class="card" id="authForm" novalidate>
      <h2><small>偉人録</small><span id="authTitle">ログイン</span></h2>
      <p class="note" id="authLead" style="margin:0;color:var(--ink-soft);font-size:14px">記録を読むにはログインが必要です。</p>
      <div class="field">
        <label for="aEmail">メールアドレス</label>
        <input type="email" id="aEmail" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="aPass">パスワード</label>
        <input type="password" id="aPass" autocomplete="current-password">
        <span class="hint hidden" id="passHint">6文字以上</span>
      </div>
      <div class="field hidden" id="pass2Field">
        <label for="aPass2">パスワード（確認）</label>
        <input type="password" id="aPass2" autocomplete="new-password">
      </div>
      <div class="err" id="authErr"></div>
      <div class="ok hidden" id="authOk"></div>
      <button type="submit" class="btn primary" id="authSubmit">ログイン</button>
      <div class="foot">
        <button type="button" class="link" id="resetBtn">パスワードを忘れた</button>
        <button type="button" class="link" id="modeBtn">はじめての方は会員登録</button>
      </div>
    </form>
  </section>

  <section id="mixView" class="hidden">
    <div class="mix-head">
      <h2 style="margin:0;font-size:38px;font-weight:500;letter-spacing:.25em;line-height:1.2"><small style="display:block;font-size:13px;color:var(--nezu);letter-spacing:.15em;margin-bottom:8px">分野も時代も混ぜて十人</small>ミックス</h2>
      <button class="btn primary" id="remixBtn">もう一度混ぜる</button>
    </div>
    <p style="margin:0 0 6px;color:var(--ink-soft);font-size:14px">泡をつつくと、その人の記録が開きます。</p>
    <div class="pond" id="pond"></div>
  </section>

  <section id="catView" class="hidden">
    <div class="cat-head">
      <h2><small id="catSub">時代順の記録</small><span id="catTitle"></span></h2>
      <button class="btn primary hidden" id="addBtn">人物を登録する</button>
    </div>
    <div class="filters hidden" id="filters"></div>
    <div class="options">
      <span class="lbl">説明文</span>
      <div class="seg" role="group" aria-label="説明文の表示">
        <button data-opt="desc" data-val="full">全文</button>
        <button data-opt="desc" data-val="head">冒頭のみ</button>
      </div>
      <span class="lbl" style="margin-left:10px">組み方</span>
      <div class="seg" role="group" aria-label="文字の組み方">
        <button data-opt="dir" data-val="yoko">横書き</button>
        <button data-opt="dir" data-val="tate">縦書き</button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>
</div>

<dialog id="dlg">
  <form class="body" id="form" method="dialog" novalidate>
    <h3 id="dlgTitle">人物を登録する</h3>
    <div class="field">
      <label for="fCat">分野</label>
      <select id="fCat"></select>
    </div>
    <div class="field">
      <label for="fName">作家名</label>
      <input type="text" id="fName" autocomplete="off">
    </div>
    <div class="field">
      <label>生年月日</label>
      <div class="date-row">
        <label class="bc"><input type="checkbox" id="fBC">紀元前</label>
        <input type="number" id="fYear" placeholder="年" min="0">
        <span class="unit">年</span>
        <input type="number" id="fMonth" placeholder="—" min="1" max="12">
        <span class="unit">月</span>
        <input type="number" id="fDay" placeholder="—" min="1" max="31">
        <span class="unit">日</span>
      </div>
      <span class="hint">月日が不明なら年だけで登録できます。</span>
    </div>
    <div class="field">
      <label>没年月日</label>
      <div class="date-row">
        <label class="bc"><input type="checkbox" id="fDBC">紀元前</label>
        <input type="number" id="fDYear" placeholder="年" min="0">
        <span class="unit">年</span>
        <input type="number" id="fDMonth" placeholder="—" min="1" max="12">
        <span class="unit">月</span>
        <input type="number" id="fDDay" placeholder="—" min="1" max="31">
        <span class="unit">日</span>
      </div>
      <span class="hint">存命の方、没年が不明な方は空のままで結構です。</span>
    </div>
    <div class="field">
      <label for="fDesc">説明文</label>
      <textarea id="fDesc" placeholder="遺した作品、言葉、生涯の出来事など。改行はそのまま表示されます。"></textarea>
    </div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" class="btn danger hidden" id="delBtn">この人物を削除</button>
      <div class="r">
        <button type="button" class="btn quiet" id="cancelBtn">やめる</button>
        <button type="submit" class="btn primary" id="saveBtn">登録する</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="diagDlg">
  <div class="body">
    <h3>接続の診断</h3>
    <p class="note">読み込みと書き込みを順に試し、Supabase が返した番号と本文をそのまま出します。</p>
    <pre id="diagOut" style="margin:0;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;background:#fff;border:1px solid var(--rule);padding:14px;max-height:50vh;overflow:auto"></pre>
    <div class="actions">
      <button type="button" class="link" id="diagCopy">結果をコピー</button>
      <div class="r"><button type="button" class="btn quiet" id="diagClose">閉じる</button></div>
    </div>
  </div>
</dialog>

<dialog id="peekDlg" class="peek">
  <div class="body">
    <div class="meta"><span class="y" id="pYear"></span><span class="tag" id="pCat" style="font-size:12px;letter-spacing:.14em;border:1px solid var(--ai);border-radius:2px;padding:1px 8px;line-height:1.7"></span></div>
    <h3 id="pName"></h3>
    <p class="desc" id="pDesc"></p>
    <div class="actions">
      <button type="button" class="link hidden" id="pEdit">この記録を編集する</button>
      <div class="r"><button type="button" class="btn quiet" id="pClose">閉じる</button></div>
    </div>
  </div>
</dialog>


<div class="toast" id="toast"></div>

<script>
/* ============================================================
   接続先の設定
   Supabase の Project URL と anon public key をここに貼ってください。
   （Supabase → Settings → API。表は supabase-setup.sql で作ります）
   空のままでも動きますが、その場合はこの端末の中だけの下書きになります。
   ============================================================ */
const SUPABASE_URL = "https://ldsdlaicexbtsocqalkp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bmuZcV-uEyzUO8LgLEkzvA_5cJQnxHC";
const MASTER_EMAIL = "michihari.natori.note@gmail.com";
const BUILD = "v11";   // 画面右上に出ます。差し替えたのにここが変わらなければ、古い画面を見ています。

(() => {
  const CATS = ["小説","俳句","哲学","詩","芸術","映画","音楽","料理","服飾","芸道","自然科学","社会科学"];
  const KEY = "ijin:data", SKEY = "ijin:session", ALL = "__all__", HEAD_LEN = 110;
  const scrub = v => String(v || "").replace(/[\s\u3000\u200b]+/g, "");
  const URL_ = scrub(SUPABASE_URL), KEY_ = scrub(SUPABASE_ANON_KEY);
  const configured = /^https?:\/\//.test(URL_) && !!KEY_;
  const BASE = URL_.replace(/\/(rest|auth)\/v1\/?$/, "").replace(/\/+$/, "");

  let data = { entries: [], settings: { desc:"full", dir:"yoko", filters:null } };
  let session = null, scope = null, editingId = null;
  const opened = new Set();
  const $ = s => document.querySelector(s);
  const hasStore = typeof window.storage?.get === "function";

  const isMaster = () => !!session && session.user.email?.toLowerCase() === MASTER_EMAIL.toLowerCase();
  const canWrite = () => !configured || !!session;
  const canEdit = e => !configured || (!!session && (isMaster() || e.owner === session.user.id));

  /* ---------- この端末の控え ---------- */
  // 端末に残す場所。アーティファクト内では window.storage、ふつうのブラウザでは localStorage。
  let ls = null;
  try { localStorage.setItem("ijin:t","1"); localStorage.removeItem("ijin:t"); ls = localStorage; } catch {}
  async function lget(k){
    try {
      if (hasStore) { const r = await window.storage.get(k,false); return r?.value ? JSON.parse(r.value) : null; }
      if (ls) { const v = ls.getItem(k); return v ? JSON.parse(v) : null; }
    } catch {}
    return null;
  }
  async function lset(k,v){
    try {
      if (hasStore) { await window.storage.set(k,JSON.stringify(v),false); return; }
      if (ls) ls.setItem(k, JSON.stringify(v));
    } catch {}
  }
  async function ldel(k){
    try {
      if (hasStore) { await window.storage.delete(k,false); return; }
      if (ls) ls.removeItem(k);
    } catch {}
  }
  const saveLocal = () => lset(KEY, data);

  /* ---------- 認証 ---------- */
  async function authPost(path, body){
    const r = await fetch(`${BASE}/auth/v1/${path}`, {
      method:"POST",
      headers:{ apikey:KEY_, "Content-Type":"application/json" },
      body:JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || `エラー ${r.status}`);
    return j;
  }
  function keepSession(j){
    session = { access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at: Math.floor(Date.now()/1000) + (j.expires_in || 3600) - 60,
      user: { id:j.user.id, email:j.user.email } };
    scheduleRefresh();
    return lset(SKEY, session);
  }
  async function refreshSession(){
    if (!session) return false;
    try { await keepSession(await authPost("token?grant_type=refresh_token", { refresh_token:session.refresh_token })); return true; }
    catch { session = null; await ldel(SKEY); return false; }
  }
  // 期限が近づいたら黙って更新する。閉じて開き直してもログインが続く。
  let refreshTimer = null;
  function scheduleRefresh(){
    clearTimeout(refreshTimer);
    if (!session) return;
    const wait = Math.max(30, session.expires_at - Math.floor(Date.now()/1000) - 120) * 1000;
    refreshTimer = setTimeout(async () => {
      if (await refreshSession()) scheduleRefresh();
      else { paintAuth(); openAuth(); }
    }, Math.min(wait, 2147483000));
  }
  async function ensureFresh(){
    if (!session) return false;
    if (session.expires_at > Math.floor(Date.now()/1000) + 60) return true;
    const ok = await refreshSession();
    if (ok) scheduleRefresh();
    return ok;
  }
  async function signIn(email, password){
    await keepSession(await authPost("token?grant_type=password", { email, password }));
  }
  // 会員登録。確認メールが要る設定なら session は返らない
  async function signUp(email, password){
    const j = await authPost("signup", { email, password });
    if (j.access_token && j.user) { await keepSession(j); return true; }
    return false;
  }
  async function signOut(){
    try { await fetch(`${BASE}/auth/v1/logout`, { method:"POST", headers:{ apikey:KEY_, Authorization:`Bearer ${session.access_token}` } }); } catch {}
    session = null; clearTimeout(refreshTimer); await ldel(SKEY);
  }

  /* ---------- 記録の読み書き ---------- */
  async function api(path, opt = {}, retry = true){
    const token = session?.access_token || KEY_;
    let r;
    try {
      r = await fetch(`${BASE}/rest/v1/ijin${path}`, {
        ...opt,
        headers:{ apikey:KEY_, Authorization:`Bearer ${token}`, "Content-Type":"application/json", ...(opt.headers||{}) }
      });
    } catch (e) { throw new Error("接続不能:" + e.message); }
    if ((r.status === 401 || r.status === 403) && session && retry) {
      if (await refreshSession()) return api(path, opt, false);
      paintAuth(); openAuth(); toast("ログインし直してください");
    }
    const text = await r.text();
    if (!r.ok) throw new Error(text.slice(0,160) || String(r.status));
    try { return text ? JSON.parse(text) : null; } catch { return null; }
  }
  const toRow = e => ({ id:e.id, cat:e.cat, name:e.name, year:e.year, bc:!!e.bc, month:e.month, day:e.day,
    d_year:e.dyear ?? null, d_bc:!!e.dbc, d_month:e.dmonth ?? null, d_day:e.dday ?? null,
    note:e.desc||"", owner:e.owner ?? session?.user.id ?? null });
  const fromRow = r => ({ id:r.id, cat:r.cat, name:r.name, year:r.year, bc:!!r.bc, month:r.month, day:r.day,
    dyear:r.d_year ?? null, dbc:!!r.d_bc, dmonth:r.d_month ?? null, dday:r.d_day ?? null,
    desc:r.note||"", owner:r.owner });
  // Supabase の返事を、直し方がわかる言葉にする
  function where(){
    if (location.protocol === "file:") return "ファイルを直接開いているため通信できません。公開したURLから開いてください。";
    if (window.self !== window.top) return "プレビューの枠の中では通信が遮断されます。公開したURLから開いてください。";
    if (location.protocol !== "https:" && location.hostname !== "localhost") return "https の場所で開いてください。";
    return "";
  }
  function explain(m){
    m = String(m);
    const w = where();
    if (/schema cache|PGRST204/i.test(m)) return "表に足りない列があります。supabase-setup.sql をもう一度 SQL Editor で実行してください。";
    if (/does not exist|42P01/i.test(m)) return "ijin の表が見つかりません。supabase-setup.sql を SQL Editor で実行してください。";
    if (/permission denied for (table|relation)/i.test(m)) return "表への権限が付いていません。supabase-setup.sql の「表そのものへの権限」の部分を実行してください。";
    if (/row-level security|42501/i.test(m)) return "書き込みが許可されていません。ログインし直すか、supabase-setup.sql をもう一度実行してください。";
    if (/ijin_cat_check/i.test(m)) return "分野の名前が表の制約と合いません。";
    if (/JWT|expired|invalid token/i.test(m)) return "ログインの期限が切れています。ログインし直してください。";
    if (/did not match the expected pattern|Load failed|Failed to fetch|NetworkError|接続不能/i.test(m))
      return "Supabase に要求を送れませんでした。" + (w || "通信が遮断されているか、接続先のURLと鍵に余分な文字が混じっています。")
        + "［" + m.slice(0,120) + "／" + location.protocol + "//" + location.hostname + (window.self !== window.top ? "・枠内" : "") + "］";
    if (/Invalid API key|No API key/i.test(m)) return "鍵が正しくありません。Supabase の API Keys にある公開鍵を貼り直してください。";
    return m;
  }
  const sbInsert = rows => api("", { method:"POST", body:JSON.stringify(rows) });
  const sbUpdate = row  => api(`?id=eq.${encodeURIComponent(row.id)}`, { method:"PATCH", body:JSON.stringify(row) });
  const sbDelete = id   => api(`?id=eq.${encodeURIComponent(id)}`, { method:"DELETE" });
  async function pull(){ data.entries = (await api("?select=*")).map(fromRow); await saveLocal(); }

  /* ---------- 並べ替え・表示 ---------- */
  const skey = e => [(e.bc ? -1 : 1) * e.year, e.month || 0, e.day || 0];
  const cmp = (a,b) => { const A=skey(a), B=skey(b); for(let i=0;i<3;i++) if(A[i]!==B[i]) return A[i]-B[i]; return a.name.localeCompare(b.name,"ja"); };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num = n => `<span class="num">${n}</span>`;
  const activeFilters = () => (data.settings.filters && data.settings.filters.length) ? data.settings.filters : CATS;

  function paintAuth(){
    const w = $("#whoNow");
    if (!configured) w.innerHTML = `<span>下書き（この端末のみ）</span>`;
    else if (session) w.innerHTML = (isMaster() ? `<span class="mark">マスター</span>` : "") + `<span>${esc(session.user.email)}</span>`;
    else w.innerHTML = `<span>閲覧のみ</span>`;
    const inside = canWrite();
    $("#loginBtn").classList.toggle("hidden", !configured || !!session);
    $("#logoutBtn").classList.toggle("hidden", !session);
    document.querySelector(".nav").classList.toggle("hidden", !inside);
    $("#export").classList.toggle("hidden", !inside);
    $("#import").classList.toggle("hidden", !canWrite());
    $("#addBtn").classList.toggle("hidden", !canWrite());
  }

  function renderGate(){
    $("#gateList").innerHTML = CATS.map(c => {
      const n = data.entries.filter(e => e.cat === c).length;
      return `<li><button data-cat="${c}"><span class="cat-name${c.length >= 4 ? " long" : ""}">${c}</span><span class="count">${n ? n+"名" : "未登録"}</span></button></li>`;
    }).join("");
  }
  function renderFilters(){
    const f = $("#filters");
    if (scope !== ALL) { f.classList.add("hidden"); return; }
    f.classList.remove("hidden");
    const act = data.settings.filters;
    f.innerHTML = `<button class="chip all" data-fil="${ALL}" aria-pressed="${!act||!act.length}">すべて</button>` +
      CATS.map(c => `<button class="chip" data-fil="${c}" aria-pressed="${!!act && act.includes(c)}">${c}</button>`).join("");
  }
  function renderList(){
    const { desc, dir } = data.settings;
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", data.settings[b.dataset.opt] === b.dataset.val));
    renderFilters();
    const list = $("#list");
    list.classList.toggle("tate", dir === "tate");
    const fils = activeFilters();
    const items = data.entries.filter(e => scope === ALL ? fils.includes(e.cat) : e.cat === scope).sort(cmp);
    if (!items.length) {
      list.classList.remove("tate");
      const cta = canWrite() ? `<br><button data-act="add">人物を登録する</button>` : "";
      list.innerHTML = `<li class="empty">${scope===ALL && data.entries.length ? "選んだ分野には誰もいません。" : "まだ誰も記録されていません。"}${cta}</li>`;
      return;
    }
    list.innerHTML = items.map(e => {
      const clip = desc === "head" && !opened.has(e.id) && (e.desc||"").length > HEAD_LEN;
      const body = clip ? esc(e.desc.slice(0,HEAD_LEN)) + "…" : esc(e.desc||"");
      const more = desc === "head" && (e.desc||"").length > HEAD_LEN
        ? `<button class="more" data-act="toggle" data-id="${e.id}">${clip ? "続きを読む" : "冒頭のみに戻す"}</button>` : "";
      const ymd = (bc,y,m,d) => (bc ? "前" : "") + num(y) + (m ? "." + num(m) + (d ? "." + num(d) : "") : "");
      const life = "（" + ymd(e.bc, e.year, e.month, e.day) + "–"
        + (e.dyear != null ? ymd(e.dbc, e.dyear, e.dmonth, e.dday) : "") + "）";
      const ops = canEdit(e) ? `<div class="ops"><button data-act="edit" data-id="${e.id}">編集</button></div>` : "";

      return `<li class="entry" data-id="${e.id}">
        <div>
          <div class="head"><h3 class="who">${esc(e.name)}</h3><span class="life">${life}</span>${scope===ALL?`<span class="tag">${esc(e.cat)}</span>`:""}${ops}</div>
          <p class="desc">${body || '<span style="color:var(--nezu)">（説明文なし）</span>'}</p>
          ${more}
        </div>
      </li>`;
    }).join("");
    if (dir === "tate") list.scrollLeft = 0;
  }
  function setView(v){
    ["gate","catView","mixView","loginView"].forEach(id => $("#"+id).classList.toggle("hidden", id !== v));
    $("#navAll").setAttribute("aria-current", v === "catView" && scope === ALL ? "page" : "false");
    $("#navMix").setAttribute("aria-current", v === "mixView" ? "page" : "false");
    window.scrollTo(0,0);
  }
  function showGate(){ scope = null; renderGate(); setView("gate"); }
  function repaint(){
    if (!$("#mixView").classList.contains("hidden")) renderMix();
    else if (scope) renderList();
    else renderGate();
  }
  function showScope(s){
    scope = s;
    $("#catTitle").textContent = s === ALL ? "全分野" : s;
    $("#catSub").textContent = s === ALL ? "十二分野を通した時代順" : "時代順の記録";
    setView("catView"); renderList();
  }

  /* ---------- ミックス ---------- */
  const MIX_N = 10;
  function showMix(){ scope = null; setView("mixView"); renderMix(); }
  function renderMix(){
    const pond = $("#pond");
    if (!data.entries.length) { pond.innerHTML = `<div class="empty" style="padding-top:120px">まだ誰も記録されていません。</div>`; return; }
    const pool = data.entries.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
    const picks = pool.slice(0, MIX_N);
    const cols = Math.min(5, picks.length), rows = Math.ceil(picks.length / cols);
    const rnd = (a,b) => a + Math.random()*(b-a);
    pond.innerHTML = picks.map((e, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      const size = Math.round(rnd(118, 168));
      const x = ((c + rnd(.18,.82)) / cols) * 100;              // 列ごとに散らす
      const y = 6 + ((r + rnd(.12,.88)) / rows) * 60;           // 上から6〜66%に浮かぶ
      const f = e.name.length > 6 ? 15 : e.name.length > 4 ? 18 : 22;
      return `<button class="bubble" data-id="${e.id}" title="${esc(e.name)}"
        style="--x:calc(${x.toFixed(1)}% - ${size/2}px);--y:${y.toFixed(1)}%;--s:${size}px;--f:${f}px;--dur:${rnd(2.2,4.2).toFixed(2)}s;--delay:${(i*0.22 + rnd(0,.5)).toFixed(2)}s">
        <span class="ct">${esc(e.cat)}</span>
        <span class="nm">${esc(e.name)}</span>
        <span class="yr">${e.bc ? "前" : ""}${e.year}${e.dyear != null ? "–" + (e.dbc ? "前" : "") + e.dyear : ""}</span>
      </button>`;
    }).join("");
  }
  const peek = $("#peekDlg");
  let peekId = null;
  function openPeek(id){
    const e = data.entries.find(x => x.id === id); if (!e) return;
    peekId = id;
    const fmt = (bc,y,m,d) => (bc ? "前" : "") + y + (m ? "." + m + (d ? "." + d : "") : "");
    $("#pYear").textContent = fmt(e.bc, e.year, e.month, e.day)
      + "–" + (e.dyear != null ? fmt(e.dbc, e.dyear, e.dmonth, e.dday) : "");
    $("#pCat").textContent = e.cat;
    $("#pName").textContent = e.name;
    $("#pDesc").textContent = e.desc || "（説明文なし）";
    $("#pEdit").classList.toggle("hidden", !canEdit(e));
    peek.showModal();
  }
  $("#pond").addEventListener("click", ev => { const b = ev.target.closest(".bubble"); if (b) openPeek(b.dataset.id); });
  $("#pClose").addEventListener("click", () => peek.close());
  $("#pEdit").addEventListener("click", () => { peek.close(); openForm(peekId); });
  $("#remixBtn").addEventListener("click", renderMix);
  $("#navMix").addEventListener("click", showMix);
  $("#navAll").addEventListener("click", () => showScope(ALL));

  /* ---------- 登録フォーム ---------- */
  const dlg = $("#dlg");
  $("#fCat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");
  function openForm(id){
    if (!canWrite()) return openAuth();
    editingId = id || null;
    const e = id ? data.entries.find(x => x.id === id) : null;
    if (e && !canEdit(e)) return toast("この記録を編集できるのは、登録した本人とマスターだけです");
    $("#dlgTitle").textContent = e ? "記録を編集する" : "人物を登録する";
    $("#saveBtn").textContent = e ? "保存する" : "登録する";
    $("#delBtn").classList.toggle("hidden", !e);
    $("#fCat").value = e?.cat || (scope && scope !== ALL ? scope : CATS[0]);
    $("#fName").value = e?.name || "";
    $("#fBC").checked = !!e?.bc;
    $("#fYear").value = e?.year ?? "";
    $("#fMonth").value = e?.month ?? "";
    $("#fDay").value = e?.day ?? "";
    $("#fDBC").checked = !!e?.dbc;
    $("#fDYear").value = e?.dyear ?? "";
    $("#fDMonth").value = e?.dmonth ?? "";
    $("#fDDay").value = e?.dday ?? "";
    $("#fDesc").value = e?.desc || "";
    $("#err").textContent = "";
    dlg.showModal(); $("#fName").focus();
  }
  $("#form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#fName").value.trim();
    const year = parseInt($("#fYear").value,10);
    const month = $("#fMonth").value ? parseInt($("#fMonth").value,10) : null;
    const day = $("#fDay").value ? parseInt($("#fDay").value,10) : null;
    const bcv = $("#fBC").checked;
    const err = $("#err");
    if (!name) return err.textContent = "作家名を入力してください。";
    if (Number.isNaN(year) || year < 0) return err.textContent = "生まれた年を数字で入力してください。";
    if (month !== null && (month < 1 || month > 12)) return err.textContent = "月は1〜12で入力してください。";
    if (day !== null && (day < 1 || day > 31 || month === null)) return err.textContent = "日を入れる場合は月も入力してください。";
    const dyear = $("#fDYear").value ? parseInt($("#fDYear").value,10) : null;
    const dmonth = $("#fDMonth").value ? parseInt($("#fDMonth").value,10) : null;
    const dday = $("#fDDay").value ? parseInt($("#fDDay").value,10) : null;
    const dbc = $("#fDBC").checked;
    if (dyear !== null && dyear < 0) return err.textContent = "没年を数字で入力してください。";
    if (dyear === null && (dmonth !== null || dday !== null)) return err.textContent = "没月日を入れる場合は没年も入力してください。";
    if (dmonth !== null && (dmonth < 1 || dmonth > 12)) return err.textContent = "没月は1〜12で入力してください。";
    if (dday !== null && (dday < 1 || dday > 31 || dmonth === null)) return err.textContent = "没日を入れる場合は没月も入力してください。";
    if (dyear !== null && ((dbc ? -dyear : dyear) < (bcv ? -year : year))) return err.textContent = "没年が生年より前になっています。";
    const old = editingId ? data.entries.find(x => x.id === editingId) : null;
    const rec = { id: editingId || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      cat:$("#fCat").value, name, year, bc:bcv, month, day,
      dyear, dbc, dmonth, dday,
      desc:$("#fDesc").value.trim(), owner: old?.owner ?? session?.user.id ?? null };
    if (configured) {
      try { old ? await sbUpdate(toRow(rec)) : await sbInsert([toRow(rec)]); }
      catch (e2) { return err.textContent = "保存できませんでした。" + explain(e2.message); }
    }
    if (old) data.entries[data.entries.indexOf(old)] = rec; else data.entries.push(rec);
    await saveLocal();
    dlg.close(); repaint(); toast(editingId ? "保存しました" : `${name} を登録しました`);
  });
  $("#delBtn").addEventListener("click", async () => {
    const e = data.entries.find(x => x.id === editingId);
    if (!confirm(`${e.name} の記録を削除しますか？`)) return;
    if (configured) {
      try { await sbDelete(editingId); }
      catch (err) { return $("#err").textContent = "削除できませんでした。" + explain(err.message); }
    }
    data.entries = data.entries.filter(x => x.id !== editingId);
    await saveLocal(); dlg.close(); repaint(); toast("削除しました");
  });
  $("#cancelBtn").addEventListener("click", () => dlg.close());

  /* ---------- ログイン ---------- */
  let authMode = "login";
  function setAuthMode(m){
    authMode = m;
    const up = m === "signup";
    $("#authTitle").textContent = up ? "会員登録" : "ログイン";
    $("#authLead").textContent = up ? "メールアドレスとパスワードを決めてください。" : "記録を読むにはログインが必要です。";
    $("#authSubmit").textContent = up ? "登録する" : "ログイン";
    $("#modeBtn").textContent = up ? "すでに会員の方はログイン" : "はじめての方は会員登録";
    $("#pass2Field").classList.toggle("hidden", !up);
    $("#passHint").classList.toggle("hidden", !up);
    $("#resetBtn").classList.toggle("hidden", up);
    $("#aPass").setAttribute("autocomplete", up ? "new-password" : "current-password");
    $("#aPass").value = ""; $("#aPass2").value = "";
    $("#authErr").textContent = ""; $("#authOk").classList.add("hidden");
  }
  function openAuth(m){
    if (!configured) return toast("接続先が未設定です。HTMLの先頭にSupabaseのURLと鍵を書いてください");
    if (dlg.open) dlg.close();
    if (peek.open) peek.close();
    setAuthMode(typeof m === "string" ? m : "login");
    setView("loginView"); $("#aEmail").focus();
  }
  $("#modeBtn").addEventListener("click", () => setAuthMode(authMode === "login" ? "signup" : "login"));
  $("#loginBtn").addEventListener("click", () => openAuth("login"));
  $("#authForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const email = $("#aEmail").value.trim(), pass = $("#aPass").value;
    const err = $("#authErr"), ok = $("#authOk");
    err.textContent = ""; ok.classList.add("hidden");
    if (!email || !pass) return err.textContent = "メールアドレスとパスワードを入れてください。";
    const up = authMode === "signup";
    if (up) {
      if (pass.length < 6) return err.textContent = "パスワードは6文字以上にしてください。";
      if (pass !== $("#aPass2").value) return err.textContent = "確認用のパスワードが一致しません。";
    }
    const label = $("#authSubmit").textContent;
    $("#authSubmit").textContent = up ? "登録中…" : "確認中…";
    try {
      const entered = up ? await signUp(email, pass) : (await signIn(email, pass), true);
      if (!entered) {
        ok.textContent = `${email} 宛に確認のメールを送りました。文中のリンクを開いて登録を済ませてから、ログインしてください。`;
        ok.classList.remove("hidden");
        setAuthMode("login"); $("#aEmail").value = email;
        return;
      }
      await pull();
      paintAuth(); showGate();
      toast(isMaster() ? "マスターとしてログインしました" : up ? "ようこそ" : "ログインしました");
    } catch (e) {
      const m = e.message;
      err.textContent =
        /Invalid login/i.test(m) ? "メールアドレスかパスワードが違います。" :
        /already registered|already exists/i.test(m) ? "このメールアドレスはすでに登録されています。" :
        /Signups not allowed|signup is disabled/i.test(m) ? "いまは新規の会員登録を受け付けていません。" :
        /weak|password/i.test(m) && up ? "パスワードが弱すぎます。文字を増やしてください。" : m;
    } finally { $("#authSubmit").textContent = label; }
  });
  $("#resetBtn").addEventListener("click", async () => {
    const email = $("#aEmail").value.trim();
    if (!email) return $("#authErr").textContent = "先にメールアドレスを入れてください。";
    try { await authPost("recover", { email }); toast("再設定の案内を送りました"); }
    catch (e) { $("#authErr").textContent = e.message; }
  });
  $("#logoutBtn").addEventListener("click", async () => {
    await signOut();
    data.entries = []; await saveLocal();
    paintAuth(); openAuth(); toast("ログアウトしました");
  });

  /* ---------- 診断 ---------- */
  const ddlg = $("#diagDlg");
  async function probe(label, path, opt = {}){
    const t0 = Date.now();
    try {
      const r = await fetch(`${BASE}/rest/v1/ijin${path}`, {
        ...opt,
        headers:{ apikey:KEY_, Authorization:`Bearer ${session?.access_token || KEY_}`, "Content-Type":"application/json", ...(opt.headers||{}) }
      });
      const body = (await r.text()).slice(0,200);
      return `${r.ok ? "○" : "×"} ${label}  HTTP ${r.status} (${Date.now()-t0}ms)\n   ${body || "（本文なし）"}`;
    } catch (e) {
      return `× ${label}  通信そのものが失敗（CORS かネットワーク）\n   ${e.name}: ${e.message}`;
    }
  }
  async function diagnose(){
    const out = $("#diagOut");
    const lines = [
      `版 ${BUILD}`,
      `場所 ${location.href}`,
      `枠内 ${window.self !== window.top ? "はい" : "いいえ"}`,
      `接続先 ${BASE}`,
      `鍵 ${KEY_.slice(0,20)}…（${KEY_.length}文字）`,
      `ログイン ${session ? session.user.email + (isMaster() ? "（マスター）" : "") : "していない"}`,
      `常駐 ${navigator.serviceWorker?.controller ? "あり" : "なし"}`,
      ""
    ];
    out.textContent = lines.join("\n") + "調べています…";
    ddlg.showModal();
    const id = "diag_" + Date.now().toString(36);
    lines.push(await probe("読み込み", "?select=id&limit=1"));
    lines.push(await probe("書き込み", "", { method:"POST", body:JSON.stringify([{
      id, cat:"小説", name:"接続試験", year:2000, bc:false, month:null, day:null,
      d_year:null, d_bc:false, d_month:null, d_day:null, note:"診断用。自動で消えます。",
      owner: session?.user.id ?? null }]) }));
    lines.push(await probe("書き換え", `?id=eq.${id}`, { method:"PATCH", body:JSON.stringify({ name:"接続試験2" }) }));
    lines.push(await probe("削除", `?id=eq.${id}`, { method:"DELETE" }));
    out.textContent = lines.join("\n");
  }
  $("#diagBtn").addEventListener("click", diagnose);
  $("#diagClose").addEventListener("click", () => ddlg.close());
  $("#diagCopy").addEventListener("click", () => { navigator.clipboard?.writeText($("#diagOut").textContent); toast("コピーしました"); });

  /* ---------- 操作 ---------- */
  $("#gateList").addEventListener("click", ev => { const b = ev.target.closest("button[data-cat]"); if (b) showScope(b.dataset.cat); });
  $("#home").addEventListener("click", showGate);
  $("#addBtn").addEventListener("click", () => openForm());
  $("#list").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "add") openForm();
    if (b.dataset.act === "edit") openForm(b.dataset.id);
    if (b.dataset.act === "toggle") { opened.has(b.dataset.id) ? opened.delete(b.dataset.id) : opened.add(b.dataset.id); renderList(); }
  });
  $("#filters").addEventListener("click", async ev => {
    const b = ev.target.closest("button[data-fil]"); if (!b) return;
    const v = b.dataset.fil;
    if (v === ALL) data.settings.filters = null;
    else {
      const cur = new Set(data.settings.filters || []);
      cur.has(v) ? cur.delete(v) : cur.add(v);
      data.settings.filters = cur.size ? CATS.filter(c => cur.has(c)) : null;
    }
    await saveLocal(); renderList();
  });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", async () => {
    data.settings[b.dataset.opt] = b.dataset.val; opened.clear(); await saveLocal(); renderList();
  }));

  /* ---------- 書き出し・読み込み ---------- */
  $("#export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ entries:data.entries }, null, 2)], { type:"application/json" });
    const a = Object.assign(document.createElement("a"), { href:URL.createObjectURL(blob), download:"ijin-kiroku.json" });
    a.click(); URL.revokeObjectURL(a.href);
  });
  $("#import").addEventListener("click", () => $("#importFile").click());
  $("#importFile").addEventListener("change", async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!Array.isArray(j.entries)) throw new Error("形式が違います");
      const ids = new Set(data.entries.map(e => e.id));
      const add = j.entries.filter(e => e.id && !ids.has(e.id)).map(e => ({ ...e, owner: session?.user.id ?? null }));
      if (configured && add.length) await sbInsert(add.map(toRow));
      data.entries.push(...add);
      await saveLocal(); repaint();
      toast(`${add.length}名を読み込みました`);
    } catch (e) { toast("読み込めませんでした（" + e.message + "）"); }
    ev.target.value = "";
  });

  let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3200); }

  /* ---------- 起動 ---------- */
  (async () => {
    const saved = await lget(KEY);
    if (saved) { data.entries = saved.entries || []; Object.assign(data.settings, saved.settings || {}); }
    if (configured) {
      session = await lget(SKEY);
      if (session) { await ensureFresh(); scheduleRefresh(); }
      if (session) { try { await pull(); } catch { toast("記録を読み込めませんでした。この端末の控えを表示しています"); } }
      else { data.entries = []; await saveLocal(); }
    } else {
      $("#setupNotice").classList.remove("hidden");
      $("#setupNotice").innerHTML = `いまは下書きの状態です。記録はこの端末の中だけに保存され、ログインもできません。<br>
        Supabase でプロジェクトを作り、<code>supabase-setup.sql</code> を SQL Editor で実行したうえで、このHTMLの先頭にある
        <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> に Project URL と anon public key を書き入れてください。`;
    }
    if (configured) {
      const where =
        location.protocol === "file:" ? "ファイルを直接開いているため、外部との通信が許可されていません。" :
        location.protocol !== "https:" && location.hostname !== "localhost" ? "https の場所で開かないと通信できません。" :
        window.self !== window.top ? "プレビューの枠の中では外部との通信が遮断されます。" : "";
      try { await api("?select=id&limit=1"); }
      catch (e) {
        $("#setupNotice").classList.remove("hidden");
        $("#setupNotice").innerHTML = "Supabase に接続できていません。" +
          esc(where || explain(e.message)) +
          (where ? "公開したURL（https://…github.io/…）から開いてください。" : "") +
          `<br><span style="color:var(--nezu);font-size:12.5px">詳細：${esc(e.message).slice(0,200)}</span>`;
      }
    }
    paintAuth();
    if (configured && !session) openAuth(); else showGate();
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState !== "visible" || !session) return;
      if (await ensureFresh()) { try { await pull(); repaint(); } catch {} }
      else { paintAuth(); openAuth(); }
    });
    $("#build").textContent = BUILD;
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      try {
        const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache:"none" });
        reg.update();
      } catch {}
    }
  })();
})();
</script>
</body>
</html>
